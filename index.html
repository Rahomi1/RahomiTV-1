<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO TV MAX | تحميل التطبيق</title>
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
            --accent-hover: #059669;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

        .hero { text-align: center; padding: 60px 20px; width: 100%; max-width: 500px; }
        
        .hero h1 { font-size: 2.5rem; margin-bottom: 20px; color: var(--accent-color); }
        .hero p { color: var(--text-muted); margin-bottom: 30px; }

        /* حاوية الأزرار الموحدة */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* الكرت الموحد (للأزرار والروابط) */
        .action-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .action-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        /* رقم الإصدار (أقصى اليسار) */
        .version-tag {
            position: absolute;
            left: 20px;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-family: monospace;
        }

        /* كود الداونلودر */
        .downloader-section {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .downloader-section:hover { background-color: #26364e; }
        .code-badge { color: var(--accent-color); font-weight: 800; font-size: 1.5rem; display: block; margin-top: 5px; }

        footer { margin-top: auto; padding: 20px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>GO TV MAX</h1>
        <p>بوابتك لعالم الترفيه اللامحدود</p>

        <div class="actions-container">
            <!-- نسخة الهواتف -->
            <button class="action-card" onclick="startSilentDownload('https://github.com/RahomiRaed/GOTV-App/releases/download/v1.0/GO_TV_MAX_Finall.1.apk')">
                <span class="version-tag">1.0.0</span>
                <span>نسخة الهواتف</span>
            </button>

            <!-- نسخة الشاشات -->
            <button class="action-card" onclick="startSilentDownload('https://github.com/Rahomi1/Gotvmax_tv/releases/download/v1.0/app-release.apk')">
                <span class="version-tag">1.0.0</span>
                <span>نسخة الشاشات وال TV BOX</span>
            </button>

            <!-- المشاهدة للأيفون -->
            <a href="https://rahomi1.github.io/Rahomi.TV/" target="_blank" class="action-card">
                <span class="version-tag">WEB</span>
                <span>المشاهدة للأيفون</span>
            </a>

            <!-- التليكرام -->
            <a href="https://t.me/GOTV_RI" target="_blank" class="action-card">
                <span class="version-tag">JOIN</span>
                <span>تابعنا على التلكرام</span>
            </a>
        </div>

        <div class="downloader-section" onclick="copyCode('1438131')">
            <p>كود التنزيل السريع (اضغط للنسخ)</p>
            <span class="code-badge" id="code-text">1438131</span>
        </div>
    </header>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 لـ GO TV MAX</p>
    </footer>

    <script>
        // دالة التحميل
        function startSilentDownload(fileUrl) {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = fileUrl; 
            document.body.appendChild(iframe);
            setTimeout(() => { document.body.removeChild(iframe); }, 10000);
        }

        // دالة نسخ الكود
        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert("تم نسخ الكود: " + code);
            });
        }
    </script>
</body>
</html>
